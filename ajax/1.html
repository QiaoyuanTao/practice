<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AJAX登录练习</title>
    <style>
      /* 简单美化布局，可选保留 */
      div {
        margin: 8px 0;
      }
      input {
        padding: 4px 6px;
        width: 260px;
      }
      .btn {
        padding: 6px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      name:
      <input type="text" id="userName" placeholder="请输入用户名" />
    </div>
    <div>
      email:
      <input type="text" id="userEmail" placeholder="请输入邮箱账号" />
    </div>
    <div>
      password:
      <!-- 密码框type改为password，隐藏明文 -->
      <input type="password" id="userPwd" placeholder="请输入密码" />
    </div>

    <div>
      <button class="btn">login in</button>
    </div>

    <script>
      // 1. 只缓存DOM元素，不在外层提前获取value
      const userNameInput = document.querySelector("#userName");
      const emailInput = document.querySelector("#userEmail");
      const pwdInput = document.querySelector("#userPwd");
      const loginBtn = document.querySelector(".btn");

      // 绑定点击事件
      loginBtn.addEventListener("click", handleLoginSubmit);

      // 登录提交主函数
      async function handleLoginSubmit() {
        // 2. 点击时实时获取最新输入值
        const userName = userNameInput.value.trim();
        const userEmail = emailInput.value.trim();
        const userPwd = pwdInput.value.trim();

        // 3. 基础非空校验
        if (!userName) {
          alert("请填写用户名");
          return;
        }
        if (!userEmail) {
          alert("请填写邮箱账号");
          return;
        }
        if (!userPwd) {
          alert("请填写密码");
          return;
        }

        // 组装请求参数，语义清晰
        const submitParams = {
          name: userName,
          email: userEmail,
          password: userPwd,
        };

        const requestUrl = "https://jsonplaceholder.typicode.com/users";
        try {
          // 发起fetch请求
          const response = await fetch(requestUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(submitParams),
          });

          console.log(response);

          // 判断HTTP响应状态是否成功
          if (!response.ok)
            throw new Error(`请求失败，状态码：${response.status}`);

          const resData = await response.json();
          console.log("接口返回数据：", resData);

          // 该接口为模拟新增用户接口，固定返回201，仅做流程练习
          // 真实登录场景：后端会校验账号密码，返回token/登录状态
          alert("模拟登录提交成功！已创建模拟用户ID：" + resData.id);

          // 拓展练习：拿到token后存储本地
          // localStorage.setItem('loginToken', resData.token);
        } catch (error) {
          // 捕获网络错误、接口异常、请求失败
          console.error("登录请求异常：", error);
          alert("登录请求失败：" + error.message);
        }
      }
    </script>
  </body>
</html>
