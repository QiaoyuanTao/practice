<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>购物车</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: #f5f5f5;
        padding: 20px;
        color: #333;
      }

      .cart-container {
        max-width: 1000px;
        margin: 0 auto;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      /* 表头 */
      .cart-header {
        display: flex;
        align-items: center;
        padding: 15px 20px;
        background: #fafafa;
        border-bottom: 1px solid #e0e0e0;
        font-size: 14px;
        color: #666;
        border-radius: 8px 8px 0 0;
      }

      .cart-header .col-check {
        width: 60px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .cart-header .col-info {
        flex: 1;
      }
      .cart-header .col-price {
        width: 120px;
        text-align: center;
      }
      .cart-header .col-num {
        width: 150px;
        text-align: center;
      }
      .cart-header .col-sum {
        width: 120px;
        text-align: center;
      }
      .cart-header .col-del {
        width: 80px;
        text-align: center;
      }

      /* 商品项 */
      .item {
        display: flex;
        align-items: center;
        padding: 20px;
        border-bottom: 1px solid #f0f0f0;
        transition: background 0.2s;
      }

      .item:hover {
        background: #fafafa;
      }

      .item:last-child {
        border-bottom: none;
      }

      /* 复选框列 */
      .check {
        width: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .checkItem {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #ff6700;
      }

      /* 商品信息 */
      .info {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .info img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid #eee;
      }

      .info a {
        color: #333;
        text-decoration: none;
        font-size: 14px;
        line-height: 1.5;
        max-width: 300px;
        transition: color 0.2s;
      }

      .info a:hover {
        color: #ff6700;
      }

      /* 单价 */
      .price {
        width: 120px;
        text-align: center;
        font-size: 14px;
        color: #666;
      }

      .price em {
        font-style: normal;
      }

      /* 数量 */
      .num {
        width: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
      }

      .num a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 1px solid #e0e0e0;
        background: #fff;
        color: #666;
        text-decoration: none;
        font-size: 16px;
        cursor: pointer;
        user-select: none;
        transition: all 0.2s;
      }

      .num a:hover {
        background: #f5f5f5;
      }

      .num a:first-child {
        border-radius: 4px 0 0 4px;
      }

      .num a:last-child {
        border-radius: 0 4px 4px 0;
      }

      .num .txt {
        width: 50px;
        height: 32px;
        border: 1px solid #e0e0e0;
        border-left: none;
        border-right: none;
        text-align: center;
        font-size: 14px;
        outline: none;
      }

      /* 小计 */
      .sum {
        width: 120px;
        text-align: center;
        font-size: 14px;
        color: #ff6700;
        font-weight: bold;
      }

      .sum em {
        font-style: normal;
      }

      /* 删除 */
      .del {
        width: 80px;
        text-align: center;
      }

      .del a {
        color: #999;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.2s;
      }

      .del a:hover {
        color: #ff6700;
      }

      /* 底部结算栏 */
      .cart-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 20px;
        background: #fafafa;
        border-top: 1px solid #e0e0e0;
        border-radius: 0 0 8px 8px;
      }

      .footer-left {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 14px;
        color: #666;
      }

      .footer-left label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }

      .footer-left a {
        color: #666;
        text-decoration: none;
      }

      .footer-left a:hover {
        color: #ff6700;
      }

      .footer-right {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .total-info {
        font-size: 14px;
        color: #666;
      }

      .total-info span {
        color: #ff6700;
        font-size: 22px;
        font-weight: bold;
      }

      .btn-pay {
        padding: 10px 30px;
        background: #ff6700;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .btn-pay:hover {
        background: #e65c00;
      }

      .btn-pay:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      /* 空购物车提示 */
      .empty-cart {
        text-align: center;
        padding: 60px 20px;
        color: #999;
        font-size: 14px;
        display: none;
      }
    </style>
  </head>
