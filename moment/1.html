<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>世界时钟 & 生日计算器</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 40px 20px;
        color: #333;
      }
      #birthday-result {
        display: flex;
        flex-direction: column;
        align-items: left;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        color: #fff;
        margin-bottom: 30px;
        font-size: 28px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }
      .card-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 16px;
        color: #555;
        border-left: 4px solid #667eea;
        padding-left: 10px;
      }
      .clock-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .clock-row:last-child {
        border-bottom: none;
      }
      .city-name {
        font-weight: 500;
        color: #444;
        width: 60px;
      }
      .city-time {
        font-family: "Courier New", monospace;
        font-size: 16px;
        color: #667eea;
        font-weight: 600;
      }
      .birthday-section {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .birthday-section label {
        font-weight: 500;
        color: #555;
      }
      input[type="date"] {
        padding: 8px 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.3s;
        cursor: pointer;
      }
      input[type="date"]:focus {
        border-color: #667eea;
      }
      .info-row {
        display: flex;
        align-items: baseline;
        padding: 10px 0;
        font-size: 15px;
        color: #555;
      }
      .info-label {
        font-weight: 600;
        color: #333;
        min-width: 100px;
      }
      .info-value {
        color: #667eea;
        font-weight: 600;
        font-size: 16px;
      }
      .highlight {
        background: linear-gradient(120deg, #ffeaa7 0%, #ffeaa7 100%);
        background-repeat: no-repeat;
        background-size: 100% 40%;
        background-position: 0 88%;
        padding: 0 4px;
        color: #2d3436;
      }
      .empty-state {
        color: #999;
        font-style: italic;
        text-align: center;
        padding: 20px;
      }
    </style>
    <base target="_blank" />
  </head>
  <body>
    <div class="container">
      <h1>🌍 世界时钟 & 🎂 生日计算器</h1>

      <!-- 世界时钟 -->
      <div class="card">
        <div class="card-title">世界时钟</div>
        <div class="clock-row">
          <span class="city-name">中国</span>
          <span class="city-time" id="time-cn" data-zone="8">--</span>
        </div>
        <div class="clock-row">
          <span class="city-name">英国</span>
          <span class="city-time" id="time-uk" data-zone="0">--</span>
        </div>
        <div class="clock-row">
          <span class="city-name">纽约</span>
          <span class="city-time" id="time-ny" data-zone="-5">--</span>
        </div>
        <div class="clock-row">
          <span class="city-name">悉尼</span>
          <span class="city-time" id="time-sydney" data-zone="10">--</span>
        </div>
      </div>

      <!-- 生日计算器 -->
      <div class="card">
        <div class="card-title">生日计算器</div>
        <div class="birthday-section">
          <label for="birthday">生日</label>
          <input type="date" id="birthday" />
        </div>
        <div id="birthday-result">
          <div class="empty-state">请选择你的生日</div>
        </div>
        <div id="result"></div>
      </div>
    </div>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/locale/zh-cn.js"></script>

    <script>
      // 设置 moment 语言为中文，确保 calendar() 等输出中文
      moment.locale("zh-cn");

      // ========== 世界时钟 ==========
      function setNow() {
        $("[data-zone]").each((i, ele) => {
          const zone = +ele.dataset.zone;
          ele.innerText = moment()
            .utcOffset(zone)
            .format("YYYY年MM月DD日 HH时mm分ss秒");
        });
      }
      setNow();
      setInterval(setNow, 1000);

      // 保存生日计算器的定时器 id，避免多次选择生日时产生多个定时器
      let birthdayTimer = null;

      function setBirthdayInfo() {
        // 先清空上一次的定时器
        if (birthdayTimer) {
          clearInterval(birthdayTimer);
          birthdayTimer = null;
        }

        // 获取输入框的内容
        const birthday = $("#birthday").val();

        // 未选择生日时显示空状态
        if (!birthday) {
          $("#birthday-result").html(
            '<div class="empty-state">请选择你的生日</div>',
          );
          return;
        }

        // 生日在未来时报错
        if (moment(birthday).isAfter(moment())) {
          $("#birthday-result").html(
            "<span>时间不正确：你的生日在未来！</span>",
          );
          return;
        }

        function render() {
          const now = moment();

          const p1 = `<span>你的生日：${birthday}</span>`;

          // 设置年龄
          const age = now.diff(birthday, "years");
          const p2 = `<span>年龄：${age}</span>`;

          // 设置 sec：每秒都会重新计算并刷新
          const sec = now.diff(birthday, "seconds");
          const p3 = `<span>你在这个世界上已经存在了${sec}秒</span>`;

          // 计算今年生日并判断是已经过去还是即将到来
          const thisYearBirthday = moment(birthday).year(now.year());
          const isFuture = thisYearBirthday.isAfter(now);
          let p4;

          if (isFuture) {
            const days = thisYearBirthday.diff(now, "days");
            const newAge = age + 1;
            p4 = `<span>你还有${days}天迎来你的${newAge}岁生日</span>`;
          } else {
            const days = now.diff(thisYearBirthday, "days");
            p4 = `<span>你已经在${days}天前迎来了你的${age}岁生日</span>`;
          }

          // 使用 calendar 显示相对日期
          const time = thisYearBirthday.calendar(null, {
            sameDay: "今天",
            nextDay: "明天",
            nextWeek: "下个 dddd",
            lastDay: "昨天",
            lastWeek: "上个 dddd",
            sameElse: "YYYY年MM月DD日",
          });
          const p5 = isFuture
            ? `<span>你将在${time}迎来你的生日</span>`
            : `<span>你已经在${time}迎来你的生日</span>`;

          // 汇总输出
          $("#birthday-result").html(p1 + p2 + p3 + p4 + p5);
        }

        render();
        // 每秒刷新一次，让“已存在秒数”实时更新
        birthdayTimer = setInterval(render, 1000);
      }

      $("#birthday").on("input", setBirthdayInfo);
    </script>

</html>
